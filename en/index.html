    <script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"When should I use a random team generator?","acceptedAnswer":{"@type":"Answer","text":"This <b>random team generator</b> is built for <b>pick-up sports</b> like soccer, basketball, and volleyball, <b>esports scrims and in-house tournaments</b> (League of Legends, Valorant), <b>classroom group projects and study groups</b>, and <b>office workshops and team-building days</b> — anywhere you need to <b>split people into teams</b> fast and keep it fair. It works as a plain <b>group generator</b> too, when you just need even groups rather than opposing teams."}},{"@type":"Question","name":"What if certain people should never be on the same team?","acceptedAnswer":{"@type":"Answer","text":"That's what <b>Keep Apart</b> groups are for. Drop everyone you want split up into the same group, and the <b>team randomizer</b> puts them on different teams whenever the team sizes allow. It's the quickest way to <b>spread the strong players around</b> instead of stacking one side, and it keeps people who clash off the same team."}},{"@type":"Question","name":"Can I force certain people to always be on the same team?","acceptedAnswer":{"@type":"Answer","text":"Yes — that's what <b>Keep Together</b> groups do. Everyone in the same group lands on the same team every time you shuffle, which is ideal for <b>couples, a parent and child, or a beginner paired with a helper</b>. If a group is too big to fit into one team, you'll get a warning before the teams are drawn."}},{"@type":"Question","name":"How does it handle players with different skill levels?","acceptedAnswer":{"@type":"Answer","text":"Switch to <b>Ability Mode</b> and rate everyone from 1 to 10. The generator then swaps players between teams until <b>every team's total score is as close as possible</b>, so no single team ends up stacked — much fairer than a <b>team picker</b> that only shuffles names
